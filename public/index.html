<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0b09">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<title>Arab RP — عرب رول بلاي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#f0b429;--gold2:#ffd36a;--ink:#fff;--panel:rgba(10,10,12,.55);--line:rgba(255,255,255,.16);--hp:#e5383b;--food:#f48c06;--money:#8ff0a4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--ink);font-family:Cairo,Rubik,Tahoma,system-ui,sans-serif;touch-action:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.hide{display:none!important}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
input{font:inherit}

/* ---------- вход ---------- */
#login{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;overflow:auto;touch-action:pan-y;
  background:radial-gradient(120% 90% at 50% 115%,#f2a541 0%,#b5562a 30%,#3a1d16 60%,#0b0809 100%)}
#login::before{content:"";position:fixed;inset:auto 0 0 0;height:34%;pointer-events:none;
  background:linear-gradient(transparent,rgba(0,0,0,.55)),
  url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1061 300' preserveAspectRatio='none'><path fill='%23150c08' d='M0 300V210h40v-40h30v40h25v-90h35v90h20v-60h30v60h40V90l12-30 12 30v120h30v-70h45v70h25v-110h40v110h20V40l6-40 6 40v170h25v-80h40v80h30v-50h30v50h35v-120h28v120h22v-70h40v70h30V120h20v-20h20v20h20v90h30v-60h40v60h25v-150l15-15 15 15v150h25v-80h35v80h40v-40h30v40h50v90z'/></svg>") bottom/100% 100% no-repeat}
.card{position:relative;width:min(560px,100%);text-align:center;z-index:1}
.logo{font-family:Rubik,sans-serif;font-weight:900;font-size:clamp(44px,10vw,78px);line-height:1;letter-spacing:.02em;direction:ltr;
  background:linear-gradient(180deg,#fff6d8,#f0b429 55%,#b8761a);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 #5a2a10) drop-shadow(0 10px 24px rgba(0,0,0,.5))}
.sub{font-size:19px;font-weight:700;margin:4px 0 14px;color:#ffe9c2}
.reg{display:grid;gap:12px;background:rgba(0,0,0,.42);border:1px solid var(--line);border-radius:18px;padding:16px;backdrop-filter:blur(6px);text-align:start}
.reg label{font-size:13px;font-weight:700;opacity:.8}
.reg input{width:100%;height:50px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;padding:0 16px;font-size:18px;text-align:center;outline:none;user-select:text;-webkit-user-select:text;margin-top:4px}
.reg input:focus{border-color:var(--gold)}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:4px}
.opt{border:2px solid var(--line);border-radius:12px;padding:8px 4px;background:rgba(255,255,255,.06);font-weight:700;font-size:14px;line-height:1.3}
.opt.on{border-color:var(--gold);background:rgba(240,180,41,.18)}
.opt i{display:block;height:34px;margin:0 auto 4px;width:34px;border-radius:50%}
.skins{display:flex;gap:10px;margin-top:4px}
.skins button{width:40px;height:40px;border-radius:50%;border:3px solid transparent}
.skins button.on{border-color:var(--gold)}
.row2{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.play{height:56px;border-radius:14px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2a1700;font-size:22px;font-weight:900;box-shadow:0 4px 0 #8a5a10}
.play:active{transform:translateY(2px);box-shadow:0 2px 0 #8a5a10}
.langs{display:flex;gap:6px}
.langs button{padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid var(--line);font-size:14px}
.langs button.on{background:#fff;color:#000}
.note{font-size:12.5px;opacity:.75;margin-top:10px}

/* ---------- HUD (не зеркалится) ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;direction:ltr}
#hud .p{pointer-events:auto}
.sa-t{top:max(10px,env(safe-area-inset-top))}.sa-b{bottom:max(12px,env(safe-area-inset-bottom))}
.sa-l{left:max(12px,env(safe-area-inset-left))}.sa-r{right:max(12px,env(safe-area-inset-right))}
#radarBox{position:absolute;width:140px}
#mini{width:140px;height:140px;border-radius:50%;border:3px solid rgba(255,255,255,.9);box-shadow:0 0 0 3px rgba(0,0,0,.45),0 6px 18px rgba(0,0,0,.5);background:#000;display:block}
#cityName{margin-top:6px;text-align:center;font-weight:900;font-size:15px;text-shadow:0 2px 3px #000,0 0 8px #000}
#stats{position:absolute;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:180px}
#clock{font-family:Rubik,sans-serif;font-weight:700;font-size:15px;opacity:.95;text-shadow:0 2px 3px #000;display:flex;gap:10px}
#money{font-family:Rubik,sans-serif;font-weight:900;font-size:30px;color:var(--money);letter-spacing:.01em;text-shadow:0 2px 0 #062a10,0 0 10px rgba(0,0,0,.7);line-height:1}
.bar{display:flex;align-items:center;gap:6px}
.bar svg{width:16px;height:16px}
.bar .tr{width:150px;height:9px;border-radius:6px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);overflow:hidden}
.bar .fl{height:100%;width:100%;transition:width .3s}
#hpF{background:linear-gradient(90deg,#9d0208,var(--hp))}#foodF{background:linear-gradient(90deg,#c35a00,var(--food))}
.menu{display:flex;gap:6px;margin-top:6px}
.ib{width:42px;height:42px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center}
.ib svg{width:21px;height:21px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#job{position:absolute;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,rgba(20,60,30,.88),rgba(10,35,18,.88));border:1px solid #36e27a;border-radius:14px;padding:6px 16px;text-align:center;min-width:230px;direction:rtl}
#job b{display:block;font-size:16px}#job span{font-size:13px;opacity:.85}
#job button{margin-top:4px;font-size:12px;background:rgba(255,255,255,.14);border-radius:8px;padding:2px 10px}
#chatlog{position:absolute;top:200px;width:min(380px,44vw);display:flex;flex-direction:column;gap:3px;font-size:14px;direction:rtl;align-items:flex-start}
#chatlog div{background:rgba(0,0,0,.5);border-radius:8px;padding:2px 9px;max-width:100%;unicode-bidi:plaintext;transition:opacity 1s;text-shadow:0 1px 2px #000}
#chatlog b{color:var(--gold2)}
#chatbox{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);display:flex;gap:6px;width:min(480px,90vw);direction:rtl}
#chatbox input{flex:1;height:46px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.8);color:#fff;padding:0 12px;font-size:16px;outline:none;user-select:text;-webkit-user-select:text;unicode-bidi:plaintext}
#chatbox button{padding:0 16px;border-radius:12px;background:var(--gold);color:#2a1700;font-weight:900}
#toast{position:absolute;left:50%;top:24%;transform:translateX(-50%);font-size:clamp(20px,3.6vw,30px);font-weight:900;text-align:center;text-shadow:0 2px 0 #000,0 0 16px rgba(0,0,0,.8);transition:opacity .4s;white-space:nowrap;direction:rtl}
#joy{position:absolute;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.08),rgba(0,0,0,.28));border:2px solid rgba(255,255,255,.3);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 3px 10px rgba(0,0,0,.4)}
.rb{position:absolute;display:flex;gap:12px;align-items:flex-end}
.cb{width:74px;height:74px;border-radius:50%;background:rgba(0,0,0,.42);border:2px solid rgba(255,255,255,.4);display:grid;place-items:center;touch-action:none}
.cb svg{width:32px;height:32px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cb.big{width:88px;height:88px}
.cb.on{background:rgba(255,255,255,.3);transform:scale(.95)}
#gas{width:92px;height:128px;border-radius:20px;background:rgba(40,170,80,.55)}
#brake{width:82px;height:82px;border-radius:20px;background:rgba(200,40,40,.55)}
.cb b{font-size:14px}
#action{position:absolute;bottom:200px;right:max(14px,env(safe-area-inset-right));padding:12px 20px;border-radius:16px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2a1700;font-weight:900;font-size:17px;box-shadow:0 4px 0 #8a5a10;direction:rtl}
#speedo{position:absolute;left:50%;transform:translateX(-50%);width:170px;height:120px}
#dead{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:radial-gradient(circle,rgba(80,0,0,.35),rgba(0,0,0,.85));font-size:clamp(30px,6vw,56px);font-weight:900;color:#ff4d4d;text-shadow:0 3px 0 #000;text-align:center}
#dead small{display:block;font-size:18px;color:#fff;opacity:.85}

/* ---------- окна ---------- */
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:12px}
.sheet{width:min(720px,100%);max-height:100%;overflow:auto;background:#151210;border:1px solid var(--line);border-radius:20px;padding:16px;touch-action:pan-y}
.sheet h2{margin:0 0 10px;font-size:21px;display:flex;justify-content:space-between;align-items:center}
.x{background:rgba(255,255,255,.1);border-radius:10px;padding:4px 12px;font-size:15px}
.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.carc{background:#221c16;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.carc.cur{border-color:var(--gold)}
.carc b{display:block;font-size:20px}.carc small{display:block;opacity:.7;font-size:12px;margin-bottom:4px}
.carc .pr{color:var(--money);font-weight:900;direction:ltr;font-family:Rubik,sans-serif}
.carc button{margin-top:8px;width:100%;height:38px;border-radius:10px;background:var(--gold);color:#2a1700;font-weight:900}
.carc button:disabled{background:#444;color:#999}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.sw button{width:38px;height:38px;border-radius:50%;border:3px solid transparent}
.sw button.on{border-color:var(--gold)}
#bigmap{width:100%;aspect-ratio:1;max-height:62vh;object-fit:contain;border-radius:14px;display:block;margin:0 auto;background:#000}
.tps{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;justify-content:center}
.tps button{padding:8px 14px;border-radius:12px;background:#2a231b;border:1px solid var(--line);font-weight:700}
.set{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:10px}
.seg{display:flex;gap:6px}.seg button{padding:7px 14px;border-radius:10px;background:#2a231b;border:1px solid var(--line);font-weight:700}
.seg button.on{background:var(--gold);color:#2a1700}
.keys{font-size:13px;opacity:.75;line-height:1.8;margin-top:10px}
#loading{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:#0b0809;font-size:22px;font-weight:900}
@media (max-height:520px){.logo{font-size:38px}.sub{margin:2px 0 8px;font-size:15px}.reg{gap:8px;padding:12px}.opt{padding:5px 4px;font-size:13px}.opt i{height:22px;width:22px}.reg input{height:42px;font-size:16px}.play{height:46px;font-size:19px}.note{display:none}.skins button{width:34px;height:34px}}
@media (orientation:landscape) and (max-height:560px){#map .sheet{display:grid;grid-template-columns:auto minmax(150px,220px);grid-template-rows:auto 1fr;gap:0 14px;width:auto;max-width:100%}#map h2{grid-column:1/-1}#bigmap{height:calc(100vh - 110px);width:auto;max-height:none}#map .tps{flex-direction:column;justify-content:flex-start;margin-top:0}}
@media (max-height:440px){#mini,#radarBox{width:112px}#mini{height:112px}#chatlog{top:160px}#joy{width:132px;height:132px}.cb{width:64px;height:64px}.cb.big{width:76px;height:76px}#gas{height:108px;width:82px}#brake{width:72px;height:72px}#money{font-size:25px}.bar .tr{width:120px}#action{bottom:170px}#speedo{width:150px;height:106px}}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="login">
  <div class="card">
    <div class="logo">ARAB RP</div>
    <div class="sub" data-i="subtitle">عرب رول بلاي</div>
    <div class="reg">
      <div><label data-i="nick">اسم الشخصية</label><input id="name" maxlength="20" autocomplete="off" data-ph="namePh" placeholder="Ahmed_Alsaadi"></div>
      <div><label data-i="outfit">الملابس</label>
        <div class="opts" id="outfits">
          <button class="opt" data-o="thobe_red"><i style="background:repeating-conic-gradient(#c0182a 0 25%,#f4f1ea 0 50%) 0 0/10px 10px"></i><span data-i="o1">ثوب وشماغ</span></button>
          <button class="opt" data-o="thobe_white"><i style="background:#fbfbf8"></i><span data-i="o2">ثوب وغترة</span></button>
          <button class="opt" data-o="casual"><i style="background:linear-gradient(#2c5d8f 50%,#2d3d5c 50%)"></i><span data-i="o3">كاجوال</span></button>
        </div></div>
      <div class="row2"><div><label data-i="skin">لون البشرة</label><div class="skins" id="skins"></div></div>
        <div class="langs"><button data-lang="ar">العربية</button><button data-lang="ru">Русский</button></div></div>
      <button class="play" id="play" data-i="play">دخول اللعبة</button>
    </div>
    <div class="note" data-i="note">نسخة تجريبية · ٥ مدن: عمّان، الرياض، دبي، الدوحة، جدة</div>
  </div>
</div>

<div id="loading" class="hide" data-i="loading">جارٍ التحميل…</div>
<div id="dead" class="hide"><div><span data-i="dead">نُقلت إلى المستشفى</span><small data-i="deadSub">-100$</small></div></div>

<div id="hud" class="hide">
  <div id="radarBox" class="sa-t sa-l"><canvas id="mini" width="280" height="280"></canvas><div id="cityName"></div></div>
  <div id="stats" class="sa-t sa-r">
    <div id="clock"><span id="online"></span><span id="time">12:00</span></div>
    <div id="money">$0</div>
    <div class="bar"><div class="tr"><div class="fl" id="hpF"></div></div><svg viewBox="0 0 24 24"><path fill="#e5383b" d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg></div>
    <div class="bar"><div class="tr"><div class="fl" id="foodF"></div></div><svg viewBox="0 0 24 24"><path fill="#f48c06" d="M4 11h16a8 8 0 0 1-16 0zm2-2c0-3 3-5 6-5s6 2 6 5z"/></svg></div>
    <div class="menu p">
      <button class="ib" id="bMap" aria-label="map"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg></button>
      <button class="ib" id="bChat" aria-label="chat"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></button>
      <button class="ib" id="bCar" aria-label="car"><svg viewBox="0 0 24 24"><path d="M3 15l2-6h14l2 6v4H3zM7 19v1M17 19v1"/><circle cx="7.5" cy="15.5" r="1"/><circle cx="16.5" cy="15.5" r="1"/></svg></button>
      <button class="ib" id="bCam" aria-label="camera"><svg viewBox="0 0 24 24"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
      <button class="ib" id="bSet" aria-label="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg></button>
      <button class="ib" id="bFull" aria-label="fullscreen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </div>
  <div id="job" class="hide sa-t p"><b id="jobT"></b><span id="jobS"></span><br><button id="jobX" data-i="cancel">إلغاء</button></div>
  <div id="chatlog" class="sa-l"></div>
  <div id="chatbox" class="hide p"><input id="chatIn" maxlength="140" data-ph="chatPh" placeholder="اكتب رسالة…"><button id="chatSend" data-i="send">إرسال</button></div>
  <div id="toast"></div>
  <button id="action" class="hide p"></button>
  <canvas id="speedo" class="hide sa-b" width="340" height="240"></canvas>
  <div id="joy" class="p sa-b sa-l"><div id="knob"></div></div>
  <div id="footBtns" class="rb sa-b sa-r p">
    <button class="cb" id="bSprint" aria-label="sprint"><svg viewBox="0 0 24 24"><circle cx="14" cy="4.5" r="2"/><path d="M8 21l3-6 3 2v5M6 12l3-4 4 1 3 4 3 1M11 15l-1-4"/></svg></button>
    <button class="cb big" id="bJump" aria-label="jump"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </div>
  <div id="carBtns" class="rb sa-b sa-r p hide">
    <button class="cb" id="bExit" aria-label="exit" style="align-self:flex-start;width:58px;height:58px"><svg viewBox="0 0 24 24"><path d="M14 4h5v16h-5M10 8l-4 4 4 4M6 12h10"/></svg></button>
    <button class="cb" id="brake"><b data-i="brake">فرامل</b></button>
    <button class="cb" id="gas"><b data-i="gas">بنزين</b></button>
  </div>
</div>

<div id="shop" class="modal hide">
  <div class="sheet">
    <h2><span data-i="showroom">معرض السيارات</span><button class="x" data-close data-i="close">إغلاق</button></h2>
    <div class="cars" id="carList"></div>
    <div class="sw"><span data-i="color">اللون:</span><span id="swatches" class="sw" style="margin:0"></span></div>
  </div>
</div>
<div id="map" class="modal hide">
  <div class="sheet">
    <h2><span data-i="map">الخريطة</span><button class="x" data-close data-i="close">إغلاق</button></h2>
    <canvas id="bigmap" width="1024" height="1024"></canvas>
    <div class="tps" id="tps"></div>
  </div>
</div>
<div id="settings" class="modal hide">
  <div class="sheet">
    <h2><span data-i="settings">الإعدادات</span><button class="x" data-close data-i="close">إغلاق</button></h2>
    <div class="set"><span data-i="gfx">الرسومات</span><div class="seg" id="gfxSeg"><button data-q="low" data-i="low">منخفضة</button><button data-q="high" data-i="high">عالية</button></div></div>
    <div class="set"><span data-i="language">اللغة</span><div class="seg langs"><button data-lang="ar">العربية</button><button data-lang="ru">Русский</button></div></div>
    <div class="keys" data-i="keys">WASD · Shift · Space · F · E · M · T · C</div>
  </div>
</div>

<script type="importmap">{"imports":{"three":"/lib/three.module.js","three/addons/":"/jsm/"}}</script>
<script type="module" src="/js/main.js"></script>
</body>
</html>
