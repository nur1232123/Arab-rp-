<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1206">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<title>Arab RP — عرب رول بلاي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#f0b429;--gold2:#ffd36a;--ink:#fff;--panel:rgba(14,12,10,.62);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--ink);font-family:Cairo,Tahoma,system-ui,sans-serif;touch-action:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.hide{display:none!important}
button{font:inherit;color:inherit;border:0;cursor:pointer}
input{font:inherit}

/* ---------- вход ---------- */
#login{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;
  background:radial-gradient(120% 90% at 50% 110%,#f2a541 0%,#b5562a 32%,#3a1d16 62%,#0e0a0b 100%)}
#login::before{content:"";position:absolute;inset:auto 0 0 0;height:38%;
  background:linear-gradient(transparent,rgba(0,0,0,.55)),
  url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1061 300' preserveAspectRatio='none'><path fill='%23150c08' d='M0 300V210h40v-40h30v40h25v-90h35v90h20v-60h30v60h40V90l12-30 12 30v120h30v-70h45v70h25v-110h40v110h20V40l6-40 6 40v170h25v-80h40v80h30v-50h30v50h35v-120h28v120h22v-70h40v70h30V120h20v-20h20v20h20v90h30v-60h40v60h25v-150l15-15 15 15v150h25v-80h35v80h40v-40h30v40h50v90z'/></svg>") bottom/100% 100% no-repeat}
.card{position:relative;width:min(440px,100%);text-align:center}
.logo{font-weight:900;font-size:clamp(46px,11vw,84px);line-height:1;letter-spacing:.02em;direction:ltr;
  background:linear-gradient(180deg,#fff6d8,#f0b429 55%,#b8761a);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 #5a2a10) drop-shadow(0 10px 24px rgba(0,0,0,.5))}
.sub{font-size:22px;font-weight:700;margin:6px 0 22px;color:#ffe9c2}
.field{display:flex;flex-direction:column;gap:12px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:18px;padding:18px;backdrop-filter:blur(6px)}
.field input{height:52px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;padding:0 16px;font-size:18px;text-align:center;outline:none;user-select:text;-webkit-user-select:text}
.field input:focus{border-color:var(--gold)}
.play{height:56px;border-radius:14px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2a1700;font-size:22px;font-weight:900;box-shadow:0 4px 0 #8a5a10}
.play:active{transform:translateY(2px);box-shadow:0 2px 0 #8a5a10}
.langs{display:flex;gap:8px;justify-content:center}
.langs button{padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid var(--line);font-size:14px}
.langs button.on{background:#fff;color:#000}
.note{font-size:13px;opacity:.75;margin-top:12px}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
#hud *{pointer-events:auto}
.top{position:absolute;top:max(10px,env(safe-area-inset-top));inset-inline-start:max(12px,env(safe-area-inset-right));display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.money{font-weight:900;font-size:26px;color:#7dff9a;text-shadow:0 2px 0 #000,0 0 10px rgba(0,0,0,.6);direction:ltr}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px 12px;font-size:14px;font-weight:700}
.btns{display:flex;gap:8px}
.ib{width:46px;height:46px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:700;display:grid;place-items:center}
.ib svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#mini{position:absolute;top:max(10px,env(safe-area-inset-top));inset-inline-end:max(12px,env(safe-area-inset-left));width:132px;height:132px;border-radius:50%;border:3px solid rgba(255,255,255,.85);box-shadow:0 4px 16px rgba(0,0,0,.5);background:#000}
#cityName{position:absolute;top:150px;inset-inline-end:max(12px,env(safe-area-inset-left));width:132px;text-align:center;font-weight:900;font-size:15px;text-shadow:0 2px 3px #000}
#job{position:absolute;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:linear-gradient(180deg,rgba(20,60,30,.85),rgba(10,35,18,.85));border:1px solid #36e27a;border-radius:14px;padding:6px 16px;text-align:center;min-width:220px}
#job b{display:block;font-size:16px}
#job span{font-size:13px;opacity:.85}
#job button{margin-top:4px;font-size:12px;background:rgba(255,255,255,.12);border-radius:8px;padding:2px 10px}
#speed{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);text-align:center;direction:ltr;text-shadow:0 2px 4px #000}
#speed b{font-size:44px;font-weight:900;line-height:1;display:block}
#speed small{font-size:13px;font-weight:700;opacity:.85}
#joy{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:150px;height:150px;border-radius:50%;background:rgba(0,0,0,.25);border:2px solid rgba(255,255,255,.35);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 3px 10px rgba(0,0,0,.4)}
.pedals{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));display:flex;gap:14px;align-items:flex-end;direction:ltr}
.pedal{border-radius:18px;font-weight:900;font-size:15px;touch-action:none;display:grid;place-items:center;border:2px solid rgba(255,255,255,.4)}
#brake{width:84px;height:84px;background:rgba(200,40,40,.55)}
#gas{width:96px;height:130px;background:rgba(40,170,80,.6)}
.pedal.on{filter:brightness(1.5);transform:scale(.96)}
#action{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:170px;padding:12px 20px;border-radius:16px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2a1700;font-weight:900;font-size:17px;box-shadow:0 4px 0 #8a5a10;max-width:60vw}
#chatlog{position:absolute;inset-inline-start:max(12px,env(safe-area-inset-right));top:172px;width:min(360px,46vw);display:flex;flex-direction:column;gap:3px;font-size:14px;pointer-events:none!important}
#chatlog div{background:rgba(0,0,0,.45);border-radius:8px;padding:2px 8px;width:fit-content;max-width:100%;unicode-bidi:plaintext;transition:opacity 1s}
#chatlog b{color:var(--gold2)}
#chatbox{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);display:flex;gap:6px;width:min(460px,90vw)}
#chatbox input{flex:1;height:46px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.75);color:#fff;padding:0 12px;font-size:16px;outline:none;user-select:text;-webkit-user-select:text;unicode-bidi:plaintext}
#chatbox button{padding:0 16px;border-radius:12px;background:var(--gold);color:#2a1700;font-weight:900}
#toast{position:absolute;left:50%;top:26%;transform:translateX(-50%);font-size:clamp(20px,4vw,30px);font-weight:900;text-align:center;text-shadow:0 2px 0 #000,0 0 16px rgba(0,0,0,.7);transition:opacity .4s;pointer-events:none!important;white-space:nowrap}

/* ---------- окна ---------- */
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:14px}
.sheet{width:min(720px,100%);max-height:100%;overflow:auto;background:#17130f;border:1px solid var(--line);border-radius:20px;padding:16px;touch-action:pan-y}
.sheet h2{margin:0 0 10px;font-size:22px;display:flex;justify-content:space-between;align-items:center}
.x{background:rgba(255,255,255,.1);border-radius:10px;padding:4px 12px;font-size:15px}
.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.carc{background:#221c16;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.carc.cur{border-color:var(--gold)}
.carc b{display:block;font-size:20px}
.carc small{display:block;opacity:.7;font-size:12px;margin-bottom:4px}
.carc .pr{color:#7dff9a;font-weight:900;direction:ltr}
.carc button{margin-top:8px;width:100%;height:38px;border-radius:10px;background:var(--gold);color:#2a1700;font-weight:900}
.carc button:disabled{background:#444;color:#999}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.sw button{width:38px;height:38px;border-radius:50%;border:3px solid transparent}
.sw button.on{border-color:var(--gold)}
#bigmap{width:100%;aspect-ratio:1;max-height:62vh;object-fit:contain;border-radius:14px;display:block;margin:0 auto;background:#000}
.tps{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;justify-content:center}
.tps button{padding:8px 14px;border-radius:12px;background:#2a231b;border:1px solid var(--line);font-weight:700}
#loading{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:#0e0a0b;font-size:22px;font-weight:900}
@media (orientation:landscape) and (max-height:560px){#map .sheet{display:grid;grid-template-columns:auto minmax(150px,220px);grid-template-rows:auto 1fr;gap:0 14px;width:auto;max-width:100%}#map h2{grid-column:1/-1}#bigmap{height:calc(100vh - 110px);width:auto;max-height:none}#map .tps{flex-direction:column;justify-content:flex-start;margin-top:0}}
@media (max-height:430px){#mini{width:104px;height:104px}#cityName{top:120px;width:104px}#joy{width:130px;height:130px}#gas{height:110px;width:86px}#brake{width:74px;height:74px}#speed b{font-size:36px}#chatlog{top:166px}#action{bottom:140px}}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="login">
  <div class="card">
    <div class="logo">ARAB RP</div>
    <div class="sub" data-i="subtitle">عرب رول بلاي</div>
    <div class="field">
      <input id="name" maxlength="18" autocomplete="off" data-ph="namePh" placeholder="اسمك في اللعبة">
      <button class="play" id="play" data-i="play">العب</button>
      <div class="langs"><button data-lang="ar">العربية</button><button data-lang="ru">Русский</button></div>
    </div>
    <div class="note" data-i="note">نسخة تجريبية · ٥ مدن: عمّان، الرياض، دبي، الدوحة، جدة</div>
  </div>
</div>

<div id="loading" class="hide" data-i="loading">جارٍ التحميل…</div>

<div id="hud" class="hide">
  <div class="top">
    <div class="money" id="money">$0</div>
    <div class="chip" id="online">0</div>
    <div class="btns">
      <button class="ib" id="bMap" aria-label="map"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg></button>
      <button class="ib" id="bChat" aria-label="chat"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></button>
      <button class="ib" id="bCam" aria-label="camera"><svg viewBox="0 0 24 24"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
      <button class="ib" id="bFull" aria-label="fullscreen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </div>
  <canvas id="mini" width="264" height="264"></canvas>
  <div id="cityName"></div>
  <div id="job" class="hide"><b id="jobT"></b><span id="jobS"></span><br><button id="jobX" data-i="cancel">إلغاء</button></div>
  <div id="chatlog"></div>
  <div id="chatbox" class="hide"><input id="chatIn" maxlength="140" data-ph="chatPh" placeholder="اكتب رسالة…"><button id="chatSend" data-i="send">إرسال</button></div>
  <div id="toast"></div>
  <button id="action" class="hide"></button>
  <div id="speed"><b id="spd">0</b><small data-i="kmh">كم/س</small></div>
  <div id="joy"><div id="knob"></div></div>
  <div class="pedals"><button class="pedal" id="brake" data-i="brake">فرامل</button><button class="pedal" id="gas" data-i="gas">بنزين</button></div>
</div>

<div id="shop" class="modal hide">
  <div class="sheet">
    <h2><span data-i="showroom">معرض السيارات</span><button class="x" data-close data-i="close">إغلاق</button></h2>
    <div class="cars" id="carList"></div>
    <div class="sw"><span data-i="color">اللون:</span><span id="swatches" class="sw" style="margin:0"></span></div>
  </div>
</div>

<div id="map" class="modal hide">
  <div class="sheet">
    <h2><span data-i="map">الخريطة</span><button class="x" data-close data-i="close">إغلاق</button></h2>
    <canvas id="bigmap" width="1024" height="1024"></canvas>
    <div class="tps" id="tps"></div>
  </div>
</div>

<script type="importmap">{"imports":{"three":"/lib/three.module.js"}}</script>
<script type="module" src="/js/main.js"></script>
</body>
</html>
